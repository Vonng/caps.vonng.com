#=======================================#
# Basics
#=======================================#
baseURL: https://capslock.vonng.com/
title: CapsLock
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: false
hasCJKLanguage: true
capitalizeListTitles: false

services:
  googleAnalytics:
    id: G-48B3KSLBJ0

#=======================================#
# OINK 0.6.0 theme module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink
  mounts:
    - source: content
      target: content
      sites:
        matrix:
          languages: [en, zh]

#=======================================#
# Languages and navigation
#=======================================#
languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: CapsLock
    params:
      description: Turn Caps Lock into Escape, a Hyper modifier, and sixteen ergonomic keyboard control planes.
      copyright:
        authors: '[Ruohang Feng](https://vonng.com/en/) · [Apache License 2.0](https://github.com/Vonng/Capslock/blob/main/LICENSE)'
        from_year: 2017
      ui:
        command_palette:
          commands:
            - id: download_capslock
              title: Download Capslock configuration
              description: Open the current Karabiner-Elements V3 JSON file
              url: https://raw.githubusercontent.com/Vonng/Capslock/main/mac_v3/capslock.json
              icon: fa-solid fa-download
              keywords: [karabiner, import, install, capslock]
    menu:
      main:
        - identifier: docs
          name: Docs
          weight: 20
          pageRef: /docs
          params:
            icon: fa-solid fa-book-open
            description: Install CapsLock and learn every control plane
        - identifier: customizer
          name: Configurator
          weight: 30
          pageRef: /customizer
          params:
            icon: fa-solid fa-sliders
            description: Inspect all sixteen planes and export a custom JSON file
        - identifier: karabiner
          name: Karabiner
          weight: 40
          url: https://karabiner-elements.pqrs.org/
          params:
            icon: fa-solid fa-arrow-up-right-from-square
            description: Download Karabiner-Elements from its official site
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: Capslock 魔改器
    params:
      description: 将大写锁定键变为 Escape、Hyper 修饰键与十六层高效键盘控制平面。
      copyright:
        authors: '[冯若航](https://vonng.com/) · [Apache License 2.0](https://github.com/Vonng/Capslock/blob/main/LICENSE)'
        from_year: 2017
      ui:
        command_palette:
          commands:
            - id: download_capslock
              title: 下载 Capslock 配置
              description: 打开当前 Karabiner-Elements V3 JSON 文件
              url: https://raw.githubusercontent.com/Vonng/Capslock/main/mac_v3/capslock.json
              icon: fa-solid fa-download
              keywords: [Karabiner, 导入, 安装, Capslock]
    menu:
      main:
        - identifier: docs
          name: 文档
          weight: 20
          pageRef: /docs
          params:
            icon: fa-solid fa-book-open
            description: 安装 CapsLock 并掌握所有控制平面
        - identifier: customizer
          name: 配置器
          weight: 30
          pageRef: /customizer
          params:
            icon: fa-solid fa-sliders
            description: 查看全部十六个控制平面并导出定制 JSON
        - identifier: karabiner
          name: Karabiner
          weight: 40
          url: https://karabiner-elements.pqrs.org/
          params:
            icon: fa-solid fa-arrow-up-right-from-square
            description: 从官方网站下载 Karabiner-Elements

#=======================================#
# Markdown and outputs
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      # Chinese source wraps at a readable column; without this a soft line
      # break between two CJK characters would render as a stray space.
      cjk:
        enable: true
        eastAsianLineBreaks: true
        eastAsianLineBreaksStyle: simple
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          inline:
            - ['\(', '\)']
          block:
            - ['$$', '$$']
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

outputs:
  home: [HTML, LLMS]
  page: [HTML, markdown]

#=======================================#
# Site parameters
#=======================================#
params:
  description: Turn Caps Lock into Escape, a Hyper modifier, and sixteen ergonomic keyboard control planes.
  images:
    - img/featured.jpg
  logo: img/logo.svg
  version: 3.1.0
  page_width: wide
  archived_version: false
  url_latest_version: https://capslock.vonng.com/
  github_repo: https://github.com/Vonng/Capslock
  github_project_repo: https://github.com/Vonng/Capslock
  github_branch: main

  highlight_classes: true
  offline_search: true
  offline_search_index: content
  offline_search_summary_length: 90
  offline_search_max_results: 10

  ui:
    shell_types: [docs, customizer]
    quick_links: [docs, customizer]
    typography: system
    breadcrumb: false
    navbar_logo: true
    navbar_theme: dark
    sidebar_icon_policy: groups
    sidebar_menu_compact: false
    sidebar_menu_foldable: false
    sidebar_menu_truncate: 100
    sidebar_cache_limit: 1000
    sidebar_search_disable: false
    sidebar_root_enabled: true
    sidebar_root_menu: false
    sidebar_width_min: 220
    sidebar_width_max: 360
    sidebar_item_overflow: wrap
    sidebar_expand_levels: 1
    dark_mode: true
    page_context_menu:
      enable: true
      assistant_links: true
    feedback:
      enable: false
    reading_time: false
    image_zoom: true

  comments:
    enable: true
    type: giscus
    giscus:
      # Threads live in this site's own repository, not the source project's.
      repo: Vonng/caps.vonng.com
      repoId: R_kgDOT_hWiQ
      category: Announcements
      categoryId: DIC_kwDOT_hWic4DD4Cs
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      theme: auto
      loading: lazy

  copyright:
    authors: '[Ruohang Feng](https://vonng.com/en/) · [Apache License 2.0](https://github.com/Vonng/Capslock/blob/main/LICENSE)'
    from_year: 2017
