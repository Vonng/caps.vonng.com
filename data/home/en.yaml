families:
  eyebrow: What the planes hold
  title: Nine families of keys, one mental model
  text:
    The physical keyboard is colour-coded by purpose, so a key's neighbourhood
    tells you what it does. Counts below are the mappings each family ships in
    V3.1.
  columns: 3
  link_label: Read the mappings
  items:
    - title: Navigation
      meta: 102 mappings
      icon: fa-solid fa-compass
      desc:
        '`HJKL` moves, `UIOP` pages. Add modifiers to select text, switch
        tabs, windows, apps and desktops, or drive the pointer and wheel.'
      url: docs/navigation/#navigation
    - title: Deletion
      meta: 12 mappings
      icon: fa-solid fa-delete-left
      desc:
        '`N` `M` `,` `.` sit under the navigation keys and delete by
        character, word or line — forwards and backwards, without moving your
        hand.'
      url: docs/navigation/#deletion
    - title: MouseKey
      meta: 63 mappings
      icon: fa-solid fa-computer-mouse
      desc:
        The numeric keypad becomes a complete mouse — eight pointer
        directions, four wheel directions and five buttons, with slow and fast
        variants.
      url: docs/navigation/#mousekey
    - title: Window control
      meta: 19 mappings
      icon: fa-solid fa-window-restore
      desc:
        Close a tab, a window or an app; cycle apps, windows, tabs and
        desktops; sleep, lock or log out. Layout is handed to Moom or Magnet.
      url: docs/workflows/#window-control
    - title: Applications
      meta: 18 mappings
      icon: fa-solid fa-rocket
      desc:
        The yellow keys launch or focus the browser, terminal, editor, IDE and
        launcher. These are defaults, not requirements.
      url: docs/workflows/#applications
    - title: Terminal & IDE
      meta: 10 mappings
      icon: fa-solid fa-terminal
      desc:
        '`⌃C` `⌃D` `⌃Z` `⌃R` without contorting your left hand, plus Vim and
        Tmux prefixes and one key each for Codex and Claude.'
      url: docs/workflows/#terminal-control
    - title: Clipboards
      meta: 10 mappings
      icon: fa-solid fa-clipboard
      desc:
        Number keys `6`–`0` become five independent text clipboards. Hyper
        with `⌘` copies into a slot; Hyper alone pastes from it.
      url: docs/workflows/#clipboard
    - title: Shifter
      meta: 16 mappings
      icon: fa-solid fa-code
      desc:
        The punctuation a programmer types all day — brackets, braces, angle
        brackets, underscore, colon and bang — one chord away.
      url: docs/workflows/#shifter
    - title: Functional
      meta: 28 mappings
      icon: fa-solid fa-sliders
      desc:
        Media, brightness, keyboard light and volume on F1–F12, screenshots on
        the backtick and F13–F14, plus fine-grained steps on the navigation
        cluster.
      url: docs/reference/#functional

install:
  eyebrow: Installation
  title: Two steps, about five minutes
  text:
    A Karabiner-Elements rule set. Nothing else to install, nothing new in the
    background.
  items:
    - title: Install Karabiner-Elements
      icon: fa-solid fa-download
      desc:
        Download it from the
        [official site](https://karabiner-elements.pqrs.org/), or use Homebrew.
        Grant the background services, Accessibility, Input Monitoring and
        Driver Extension permissions macOS asks for.
      cmd:
        code: brew install --cask karabiner-elements
    - title: Import the rules
      icon: fa-solid fa-file-import
      desc:
        Open this URL in any browser — it hands the configuration straight to
        Karabiner-Elements. Choose **Import**, then enable the rules you want
        under **Complex Modifications**.
      cmd:
        code: karabiner://karabiner/assets/complex_modifications/import?url=https://raw.githubusercontent.com/Vonng/Capslock/main/mac_v3/capslock.json

voices:
  eyebrow: From real users
  title: The keyboard setup people write emails about
  text:
    Not marketing copy — two emails, in full, from people who put CapsLock
    Enhancement into their daily work.
  columns: 2
  items:
    - comment: |-
        I just wanted to reach out to a fellow dev and say thank you so much
        for all the hard work you put into your Capslock enhancements.

        I was already using a hyper/escape key via karabiner elements and used
        it to hot-swap focus between apps as you have on a few of your keys.

        But **HOT DAMN** you took it to a whole new level. This is amazing. I
        have printed out your reference image and have it hanging on my
        monitor.

        I am slowly tweaking and customizing to make it fit my workflow. Thank
        you again and again for showing me a new way to think about my
        keyboard with multiple HYPER LAYERS!

        *Behind it all is surely an idea so simple, so beautiful, that when we
        grasp it — in a decade, a century, or a millennium — we will all say to
        each other, how could it have been otherwise?*
        — John Archibald Wheeler, Annals of the New York Academy of Sciences,
        480 (1986)
      name: Matthew Kelly
      desc: '“MCGA is Amazing” · 22 February 2019'
      icon: fa-solid fa-envelope-open-text
    - comment: |-
        Hello author:

        I stumbled upon your git library today, downloaded it and tried it
        out: `github.com/Vonng/Capslock` — and I am really impressed. This
        script made me really love my keyboard.

        I'm using a Filco 87 dual-mode keyboard just like you, and this script
        makes me feel like flying!

        I'm just sending you an email to express my sincere thanks and hope
        you will continue to maintain it in the future.

        Thanks again!
      name: Qiang Zhang
      desc: '“非常感谢您的改键大作” · translated from Chinese'
      icon: fa-solid fa-envelope-open-text

history:
  eyebrow: Thirteen years of one idea
  title: From an AutoHotkey script to a Karabiner rule set
  items:
    - date: 2013
      title: Windows, AutoHotkey
      desc:
        The first CapsLock Enhancement turns the key into a modifier on
        Windows. Archived, but still in the repository.
    - date: 2015
      title: macOS V1
      desc: Ported to the original Karabiner and its XML private configuration.
    - date: 2017
      title: macOS V2
      desc:
        Rebuilt on Karabiner-Elements complex modifications. The sixteen
        control planes appear, and the project enters the official gallery.
    - date: 2021
      title: macOS V3
      desc:
        The configuration becomes a readable YAML source compiled into
        Karabiner JSON, so mappings can be reviewed as data.
    - date: 2026
      title: V3.1
      desc:
        Five clipboards on `6`–`0`, Codex and Claude on `C`, screenshots on
        F13 and F14, Spotlight and Alfred 5 defaults.
      url: docs/reference/#versions

faq:
  eyebrow: Before you install
  title: Questions worth asking first
  items:
    - question: Do I lose Caps Lock itself?
      answer: >-
        No. Hyper plus `⎋` toggles the original Caps Lock state, and macOS
        still shows the indicator. In practice the state is needed a few times
        a month, while Escape is needed a few times a minute — which is the
        whole argument for the swap.
      open: true
    - question: Will my other shortcut apps still work?
      answer: >-
        Yes. Hyper is not a private signal: it is `⌘` `⌥` `⌃` `⇧` on the
        **right** side of the keyboard, held together. Alfred, Moom, Magnet,
        Raycast and your IDE receive a perfectly ordinary chord and can bind
        it like any other.
    - question: Do I have to accept the default application keys?
      answer: >-
        No. The [configurator](/customizer/) rewrites the applications behind
        the yellow keys in the browser and exports a new JSON file. For
        anything deeper, edit `mac_v3/capslock.yml` in a fork and regenerate
        the JSON.
    - question: Does it need a special keyboard?
      answer: >-
        No. The layout assumes an ANSI keyboard and works on built-in Apple
        keyboards and external ones alike. The numeric-keypad mouse layer
        needs a keypad; everything else does not.
    - question: What about Windows and Linux?
      answer: >-
        The Windows AutoHotkey version is archived in the repository and no
        longer maintained. Linux is not supported: desktop environments differ
        too much for one configuration. A port with tools such as `xmodmap`
        would be welcome.
    - question: What does it cost, and what does it collect?
      answer: >-
        Nothing, and nothing. The rule set is Apache-2.0 licensed data
        interpreted by Karabiner-Elements; there is no account, no telemetry
        and no separate background process.

