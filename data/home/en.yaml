capabilities:
  eyebrow: Why one key is enough
  title: The key you never press, doing the work of many
  text:
    The most reachable key on the board does nothing. Here is what it does
    instead.
  items:
    - ref: 01 / THE CORE IDEA
      title: Tap for Escape, hold for Hyper
      url: docs/getting-started/#hyper
      motto: One key, two unambiguous jobs
      bullets:
        - A short tap sends `Esc`, back within reach
        - 'A hold sends **✱ Hyper**: all four *right-side* modifiers'
        - So Alfred, Moom and your IDE see an ordinary chord
        - '`✱ Esc` still toggles the original Caps Lock'
        - '`✱ Space` still switches the input source'
      value: Nothing is lost. Everything moves closer.
      visual:
        type: card
        icon: fa-solid fa-keyboard
        title: '`⇪` Caps Lock'
        lines:
          - '**Tap** → `⎋` Escape'
          - '**Hold** → `✱` Hyper modifier'
          - '`✱` `⎋` → the original Caps Lock toggle'
          - '`✱` `␣` → switch input source'
    - ref: 02 / ADDRESSABLE SPACE
      title: Sixteen planes, not one layer
      url: docs/getting-started/#control-planes
      motto: Four modifiers, four bits, sixteen planes
      bullets:
        - The *left-side* `⌘` `⌥` `⌃` `⇧` are four binary switches
        - Plane zero carries the daily essentials
        - Nine planes are in use; seven stay free for you
        - A plane you add behaves exactly like one that ships
      value: The keyboard stops being a surface and becomes an address space.
      visual:
        type: code
        aria_label: How control planes are addressed
        title: control-planes
        lines:
          - { class: c, prefix: '# ', text: 'plane = left ⌘⌥⌃⇧ read as four bits' }
          - { class: ok, prefix: '✱      ', text: 'plane  0   89 mappings' }
          - { class: p, prefix: '✱⌘     ', text: 'plane  1   59 mappings' }
          - { class: p, prefix: '✱⌥     ', text: 'plane  2   38 mappings' }
          - { class: p, prefix: '✱⇧     ', text: 'plane  8   25 mappings' }
          - { class: p, prefix: '✱⌘⇧    ', text: 'plane  9   21 mappings' }
          - { class: p, prefix: '✱⌥⇧    ', text: 'plane 10   21 mappings' }
          - { class: c, prefix: '# ', text: '9 planes in use, 7 still yours' }
    - ref: 03 / CONFIGURATION AS DATA
      title: Read it all. Then change it.
      url: customizer/
      motto: One JSON file, no hidden state
      bullets:
        - The configurator reads the JSON this project ships
        - Every plane, every key, its real Karabiner output
        - Rename the apps behind the yellow keys, then export
        - 'Deeper still: edit `capslock.yml`, run one `make`'
      value: Inspect first. Customize with confidence.
      visual:
        type: components
        aria_label: Documentation and tools
        columns: 2
        items:
          - {
              icon: fa-solid fa-bolt,
              title: Install & Hyper,
              detail: karabiner setup,
              url: docs/getting-started/,
            }
          - {
              icon: fa-solid fa-compass,
              title: Navigation,
              detail: move · select · mouse,
              url: docs/navigation/,
            }
          - {
              icon: fa-solid fa-terminal,
              title: Workflows,
              detail: windows · apps · shell,
              url: docs/workflows/,
            }
          - {
              icon: fa-solid fa-table-list,
              title: Reference,
              detail: keys · symbols · FAQ,
              url: docs/reference/,
            }
          - {
              icon: fa-solid fa-sliders,
              title: Configurator,
              detail: inspect and export,
              url: customizer/,
