capabilities:
  eyebrow: 为什么一个键就够了
  title: 那个几乎从不按下的键，可以承担一整套工作流
  text: 键盘上最顺手的那个键什么都不做。下面是它可以做的事。
  items:
    - ref: 01 / 核心思路
      title: 单击 Escape，按住 Hyper
      url: docs/getting-started/#hyper
      motto: 一个键，两份互不冲突的职责
      bullets:
        - 轻点一下发送 `Esc`，让最高频的按键回到手指旁边
        - '按住则发送 **✱ Hyper**：**右侧**四个修饰键同时按下'
        - Alfred、Moom 与 IDE 收到的都是普通组合键
        - '`✱ Esc` 仍可切换原始的大写锁定状态'
        - '`✱ Space` 仍可切换输入法'
      value: 什么都没有失去，一切都离手更近。
      visual:
        type: card
        icon: fa-solid fa-keyboard
        title: '`⇪` Caps Lock'
        lines:
          - '**单击** → `⎋` Escape'
          - '**按住** → `✱` Hyper 修饰键'
          - '`✱` `⎋` → 切换原始大写锁定'
          - '`✱` `␣` → 切换输入法'
    - ref: 02 / 可寻址空间
      title: 十六个控制平面，而不是一层
      url: docs/getting-started/#control-planes
      motto: 四个修饰键，四个二进制位，十六个平面
      bullets:
        - '**左侧**的 `⌘` `⌥` `⌃` `⇧` 就是四个二进制开关'
        - 零号平面承载日常高频操作
        - 九个平面已被使用，还有七个留给你
        - 你新增的平面与内置平面地位完全相同
      value: 键盘不再是一个平面，而是一段地址空间。
      visual:
        type: code
        aria_label: 控制平面的寻址方式
        title: control-planes
        lines:
          - { class: c, prefix: '# ', text: '平面 = 左侧 ⌘⌥⌃⇧ 的四位二进制组合' }
          - { class: ok, prefix: '✱      ', text: '平面  0    89 个映射' }
          - { class: p, prefix: '✱⌘     ', text: '平面  1    59 个映射' }
          - { class: p, prefix: '✱⌥     ', text: '平面  2    38 个映射' }
          - { class: p, prefix: '✱⇧     ', text: '平面  8    25 个映射' }
          - { class: p, prefix: '✱⌘⇧    ', text: '平面  9    21 个映射' }
          - { class: p, prefix: '✱⌥⇧    ', text: '平面 10    21 个映射' }
          - { class: c, prefix: '# ', text: '已用 9 个平面，还剩 7 个' }
    - ref: 03 / 配置即数据
      title: 先看清每一处映射，再动手修改
      url: customizer/
      motto: 一个 JSON 文件，没有隐藏状态
      bullets:
        - 配置器读取的就是本项目发布的那份 JSON
        - 逐平面、逐按键展示真实的 Karabiner 输出
        - 改掉黄色按键背后的应用，再导出新配置
        - '还想更深：改 `capslock.yml`，跑一条 `make`'
      value: 先看懂，再定制。
      visual:
        type: components
        aria_label: 文档与工具
        columns: 2
        items:
          - {
              icon: fa-solid fa-bolt,
              title: 安装与基础,
