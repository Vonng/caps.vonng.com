families:
  eyebrow: 平面里装着什么
  title: 九类按键，一套心智模型
  text: 键盘按用途分区着色，一个键的邻居就告诉你它做什么。下面的数量是 V3.1 中各类目实际包含的映射数。
  columns: 3
  link_label: 查看映射
  items:
    - title: 导航
      meta: 102 个映射
      icon: fa-solid fa-compass
      desc: '`HJKL` 移动，`UIOP` 翻页。叠加修饰键即可选择文本，切换标签页、窗口、应用与桌面，或者驱动指针与滚轮。'
      url: docs/navigation/#navigation
    - title: 删除
      meta: 12 个映射
      icon: fa-solid fa-delete-left
      desc: '`N` `M` `,` `.` 就在导航键正下方，向前向后按字符、单词或整行删除，手不必离开核心区。'
      url: docs/navigation/#deletion
    - title: 鼠标键
      meta: 63 个映射
      icon: fa-solid fa-computer-mouse
      desc: 小键盘变成一只完整的鼠标：八个指针方向、四个滚轮方向、五个按键，并带有加速与减速变体。
      url: docs/navigation/#mousekey
    - title: 窗口管理
      meta: 19 个映射
      icon: fa-solid fa-window-restore
      desc: 关闭标签页、窗口或应用；在应用、窗口、标签页与桌面之间切换；睡眠、锁屏与注销。窗口布局交给 Moom 或 Magnet。
      url: docs/workflows/#window-control
    - title: 应用捷径
      meta: 18 个映射
      icon: fa-solid fa-rocket
      desc: 黄色按键用于启动或切换浏览器、终端、编辑器、IDE 与启动器。这些只是默认值，不是约束。
      url: docs/workflows/#applications
    - title: 终端与 IDE
      meta: 10 个映射
      icon: fa-solid fa-terminal
      desc: '`⌃C` `⌃D` `⌃Z` `⌃R` 不再需要别扭的左手姿势，还有 Vim 与 Tmux 的前缀键，以及 Codex 和 Claude 各占一个键。'
      url: docs/workflows/#terminal-control
    - title: 剪贴板
      meta: 10 个映射
      icon: fa-solid fa-clipboard
      desc: 数字键 `6`–`0` 变成五个互相独立的文本剪贴板。Hyper 加 `⌘` 复制到某一槽位，单独 Hyper 从中粘贴。
      url: docs/workflows/#clipboard
    - title: 字符变换
      meta: 16 个映射
      icon: fa-solid fa-code
      desc: 程序员整天都在敲的标点 —— 圆括号、花括号、尖括号、下划线、冒号与感叹号 —— 都只有一个组合键的距离。
      url: docs/workflows/#shifter
    - title: 功能键
      meta: 28 个映射
      icon: fa-solid fa-sliders
      desc: F1–F12 上的媒体、亮度、键盘背光与音量，反引号与 F13–F14 上的截图，以及导航键簇上的细粒度调节。
      url: docs/reference/#functional

install:
  eyebrow: 安装
  title: 两步，大约五分钟
  text: 一组 Karabiner-Elements 规则，没有别的东西需要安装，也不新增后台进程。
  items:
    - title: 安装 Karabiner-Elements
      icon: fa-solid fa-download
      desc: 从[官方网站](https://karabiner-elements.pqrs.org/)下载，或者使用 Homebrew 安装。按 macOS 提示授予后台服务、辅助功能、输入监控与驱动扩展权限。
      cmd:
        code: brew install --cask karabiner-elements
    - title: 导入规则
      icon: fa-solid fa-file-import
      desc: 在任意浏览器中打开下面这个 URL，它会把配置直接交给 Karabiner-Elements。点击 **Import**，再在 **Complex Modifications** 中启用需要的规则。
      cmd:
        code: karabiner://karabiner/assets/complex_modifications/import?url=https://raw.githubusercontent.com/Vonng/Capslock/main/mac_v3/capslock.json

voices:
  eyebrow: 来自真实用户
  title: 一套让人专程写信道谢的键盘方案
  text: 这些不是市场文案，而是两封完整的用户来信 —— 来自把补完计划用进日常工作的人。
  columns: 2
  items:
    - comment: |-
        我只想向这位开发者朋友致以最诚挚的谢意，感谢您在 CapsLock
        Enhancement 中付出的辛苦努力！

        先前我也用 Karabiner-Elements 改了个 Hyper/Escape 切换键，也像你一样
        配置了几个应用快捷方式。

        但你简直把这个东西提升到了一个**全新的境界**，太不可思议了！我把你的
        键位参考图打印下来贴在了显示器上！

        我正在慢慢微调，让它逐渐适配我自己的工作流。感谢你，向我展示了一种
        赋予键盘多个 Hyper 控制平面的可能性！

        *在这一切的背后，一定会有一个如此优雅而简单的解法：无论是花费十年、
        一百年还是一千年，当我们最终发现它时，都会面面相觑 —— 除了它，还能
        是什么呢？* —— 约翰·阿奇博尔德·惠勒，《纽约科学院年鉴》，480（1986）
      name: Matthew Kelly
      desc: '“MCGA is Amazing” · 2019 年 2 月 22 日 · 译自英文'
      icon: fa-solid fa-envelope-open-text
    - comment: |-
        作者您好，

        我今天偶然发现了您的 git 库 `github.com/Vonng/Capslock`，下载试用了
        一下，真是佩服得五体投地。

        这个 script 让我真正爱上了键盘。

        刚好我用的也是 Filco 87 双模键盘，配合这个 script，真是感觉要飞起来
        了！

        发邮件只是为了表达衷心的感谢，希望您以后还能继续维护下去。

        再次衷心感谢！
      name: 张强
      desc: '“非常感谢您的改键大作” · 中文原文'
      icon: fa-solid fa-envelope-open-text

