faq:
  eyebrow: 安装之前
  title: 值得先问清楚的问题
  items:
    - question: 会失去大写锁定功能吗？
      answer: >-
        不会。Hyper 加 `⎋` 就能切换原始的大写锁定状态，macOS 的指示灯照常工作。实际使用中，大写锁定一个月用不了几次，而 Escape 一分钟要用好几次 —— 这正是交换二者的理由。
      open: true
    - question: 其他快捷键工具还能正常工作吗？
      answer: >-
        可以。Hyper 不是私有信号，它就是键盘**右侧**的 `⌘` `⌥` `⌃` `⇧` 同时按下。Alfred、Moom、Magnet、Raycast 以及各类 IDE 收到的是一个完全普通的组合键，可以像绑定其他快捷键一样绑定它。
    - question: 必须接受默认的应用快捷键吗？
      answer: >-
        不必。[配置器](/zh/customizer/)可以在浏览器里改写黄色按键背后的应用，并导出新的 JSON 文件。需要更深的定制，就 fork 仓库、修改 `mac_v3/capslock.yml`，再重新生成 JSON。
    - question: 需要特殊键盘吗？
      answer: >-
        不需要。布局以 ANSI 键盘为蓝本，内置键盘与外接键盘同样适用。小键盘鼠标层需要一块数字小键盘，其余功能都不需要。
    - question: Windows 与 Linux 呢？
      answer: >-
        Windows 上的 AutoHotkey 版本已归档，不再维护。Linux 暂不支持：各桌面环境差异太大，一份配置难以覆盖。欢迎用 `xmodmap` 之类工具移植。
    - question: 收费吗？会收集什么数据？
      answer: >-
        不收费，也不收集任何数据。这套规则是以 Apache-2.0 授权的数据，由 Karabiner-Elements 解释执行；没有账号，没有遥测，也没有独立的后台进程。

